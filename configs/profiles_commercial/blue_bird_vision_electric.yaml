    value: 6.5
    confidence: low
    source: "estimated — docs/research/commercial_profiles_v1.md"
    note: "Derived from this vehicle's own real disclosed exterior width (96in/2.44m) x overall height (123in/3.12m), reduced by a standard 0.85 shape factor for a boxy bus body (rounded roof, underbody ground clearance). Not reused from the passenger-EV placeholder (2.3 m^2) for the same reason as drag_coefficient above."
  rolling_resistance_coefficient:
    value: 0.01
    confidence: low
    source: "placeholder — outside docs/research/commercial_profiles_v1.md's scope, not vehicle-specific"
    note: "Shared six-profile placeholder, reused verbatim — heavy-truck tire rolling-resistance coefficients are reported in a similar order of magnitude (~0.006-0.01), unlike the vehicle-dynamics fields above where verbatim reuse would be implausible."
  wheel_radius_m:
    value: 0.51
    confidence: medium
    source: "derived from real 11R22.5 tire size — docs/research/commercial_profiles_v1.md"
    note: "11R22.5 is this vehicle's actual disclosed tire size (Blue Bird spec sheet); overall diameter for that size is ~40.4in per standard commercial-tire tables, giving radius ~0.51m. Not independently confirmed against a loaded-radius measurement for this specific vehicle."
