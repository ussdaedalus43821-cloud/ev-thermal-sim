    value: 12250.0
    confidence: low
    source: "estimated — docs/research/commercial_profiles_v1.md"
    note: "No curb weight disclosed by Blue Bird anywhere found (searched specifically). Estimated from this vehicle's own real disclosed GVWR (33,000 lb) and battery mass (~1,100kg, see battery.mass_kg), against typical Type C school bus curb-weight-to-GVWR ratios (~75-80%) reported in general industry sources. NOT a passenger-EV placeholder reused verbatim — 1800kg (the shared six-profile value) would be physically implausible for this GVWR class and would make the simulated vehicle accelerate unrealistically."
  drag_coefficient:
    value: 0.65
    confidence: low
    source: "estimated — docs/research/commercial_profiles_v1.md"
    note: "Typical published Cd range (~0.6-0.7) for boxy Type C/D school bus bodies; not wind-tunnel data for this specific model. Not reused from the passenger-EV placeholder (0.28) — a school bus's boxy frontal profile is a genuinely different aerodynamic shape class, not just an unresearched number."
