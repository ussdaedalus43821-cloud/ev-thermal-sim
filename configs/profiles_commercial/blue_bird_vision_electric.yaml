# ManufacturerProfile data for the Blue Bird Vision Electric (194 kWh pack
# generation, 2024+), a Type C electric school bus.
# Source: docs/research/commercial_profiles_v1.md — Blue Bird Vision Electric.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# NOT in configs/profiles/ alongside the six passenger-EV reference
# vehicles, deliberately — this is the first entry in a separate commercial-
# vehicle track (configs/profiles_commercial/), built for the Transition
# seam's gap-1 closure (see docs/seam_reconnaissance.md §6/§7), not a
# seventh member of "the six" this project's aging-coefficient-sharing
# design, flagship comparisons, and Monte Carlo record are built around.
# See tests/test_profiles_commercial.py, not tests/test_profiles.py.
#
# Same "isolate the researched variable" methodology as the six passenger
# profiles: thermal-management fields and the electrical specs this
# research actually covers are vehicle-specific; everything else is the
# SAME shared, non-vehicle-specific placeholder value used across all six
# passenger profiles, reused verbatim here too (per-field source notes say
# so explicitly). Two categories of field could NOT simply reuse the
# passenger-EV placeholder without producing a wrong or self-contradictory
# profile — see commercial_profiles_v1.md's own "Fields intentionally NOT
# re-derived" section for why: vehicle-dynamics fields that would make a
# 33,000lb-GVWR bus behave like a car, and the battery OCV curve, which had
# to be rescaled to this pack's real 583-689V operating range rather than
# reused verbatim at the passenger-EV placeholder's 300-395V.
#
# model_year_range: research is specific to the 194kWh BP97E-based "new
# standard" battery pack generation described in Blue Bird's dated
# (2025-03-17) spec sheet; the exact model-year cutover to this pack
# generation is not independently confirmed, so this range is an estimate
# bracketing that spec sheet's publication.

name: "Blue Bird Vision Electric (194 kWh pack)"
model_year_range: [2024, 2026]

vehicle_dynamics:
