# ManufacturerProfile data for the Nissan Leaf (2011-2017, Gen 1).
# Source: docs/research/profiles_v1.md — Nissan Leaf.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# Thermal-management fields (battery/motor cooling, derate thresholds, heat
# pump) reflect this specific vehicle's research wherever the research
# states a number. VehicleDynamics, AuxLoads, and most of the battery's
# equivalent-circuit parameters are NOT covered by the research at all —
# those are shared placeholder values, identical across all six profiles,
# tagged confidence: low with an "outside research scope" source. This is
# deliberate: it isolates the thermal-architecture variable for cross-
# vehicle comparison rather than confounding it with un-researched chassis/
# electrical differences. See docs/model_reference.md for the per-profile
# confidence summary.
#
# model_year_range: research gives a closed range (2011-2017) for this
# generation, used directly.

