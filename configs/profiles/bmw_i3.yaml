# ManufacturerProfile data for the BMW i3 (2013+, early/22kWh generation).
# Source: docs/research/profiles_v1.md — BMW i3.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# Represents the original 22kWh pack (the vehicle's initial, most-
# completely-described configuration in the research); the later 42.2kWh
# pack variant exists per research but isn't modeled as a separate
# profile. Base trim (no heat pump) modeled — research describes the heat
# pump as optional equipment, not standard.
#
# This is the profile that motivated adding BatterySpec.min_charge_temp_k
# to the schema: research gives an explicitly asymmetric operating range
# (charge 0-60C, discharge -25-60C) that a single min_operating_temp_k
# field can't represent.
#
# CAUTION -- battery.thermal_node.resistance_to_ambient_k_per_w below is an
# APPROXIMATION, not physically the ambient resistance: the i3's real DX
# (direct expansion) refrigerant cooling is an active loop to a colder-than-
# air sink, and this schema doesn't yet support a refrigerant-loop
# abstraction (see CLAUDE.md's Milestone D). See that field's own note for
# the full caveat and docs/model_reference.md's BMW i3 section. Do not use
# i3-vs-Leaf battery comparisons for publication until Milestone D lands.
#
# model_year_range: research states an open-ended "2013+"; no end year is
# given, so this uses [2013, 2013] rather than inventing one.
#
# VehicleDynamics, AuxLoads, and most of the battery's equivalent-circuit
# parameters are NOT covered by the research — shared placeholder values,
# identical across all six profiles. See nissan_leaf.yaml's header comment
# for the full rationale.

