# ManufacturerProfile data for the Chevrolet Bolt (2017-2022).
# Source: docs/research/profiles_v1.md — Chevrolet Bolt.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# model_year_range: research gives a closed range (2017-2022), used
# directly.
#
# VehicleDynamics, AuxLoads, and most of the battery's equivalent-circuit
# parameters are NOT covered by the research — shared placeholder values,
# identical across all six profiles, EXCEPT gear_ratio, which the research
# does give for the Bolt specifically (final drive 7.05:1) and is used
# here in place of the shared placeholder. See nissan_leaf.yaml's header
# comment for the full rationale.
#
# Note (not a schema field): the research's central Bolt story is that the
# thermal design itself was fine — the actual failure was LG Chem cell
# manufacturing defects (torn anode + folded separator) causing fires and
# a full recall, with charging software-limited to 80-90% until packs were
# replaced. Nothing in this profile's thermal fields reflects that; it's a
# manufacturing-quality/cell-defect story, not a thermal-architecture one.

