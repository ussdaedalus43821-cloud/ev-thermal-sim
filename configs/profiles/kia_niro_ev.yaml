# ManufacturerProfile data for the Kia Niro EV (2018+, long-range/64kWh
# heat-pump trim).
# Source: docs/research/profiles_v1.md — Kia Niro EV.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# Represents the 64kWh long-range pack with the heat-pump trim, since the
# research describes that configuration in the most thermal detail (shared
# coolant loop through battery/motor/inverter/heat pump, waste-heat
# scavenging). The 39.2kWh standard-range pack exists per research but
# isn't modeled as a separate profile.
#
# model_year_range: research states an open-ended "2018+"; no end year is
# given, so this uses [2018, 2018] rather than inventing one.
#
# VehicleDynamics, AuxLoads, and most of the battery's equivalent-circuit
# parameters are NOT covered by the research — shared placeholder values,
# identical across all six profiles. See nissan_leaf.yaml's header comment
# for the full rationale.
#
# Note (not a schema field): research's central Niro story is that the
# thermal HARDWARE (liquid cooling + heat pump) is solid, but early models
# lacked battery preconditioning for DC fast charging, and the shared
# coolant loop sometimes prioritized cabin comfort over pack conditioning
# — an integration/control-policy failure mode, not a hardware one. A 2020
# Niro drive-motor overheating sensor fault (erroneously cut power to
# turtle mode, required motor replacement) is also documented — a control/
# sensor fault, not a thermal-design flaw either.

