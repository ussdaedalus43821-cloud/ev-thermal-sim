# ManufacturerProfile data for the Audi e-tron (2019+).
# Source: docs/research/profiles_v1.md — Audi e-tron.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# Modeled as a single aggregate motor entry using the "D mode" combined
# dual-motor output (265kW/561Nm), not two separate front/rear MotorSpec
# entries — research gives front/rear power split (135kW/165kW) but only a
# COMBINED torque figure, so splitting into two entries would need an
# invented per-motor torque split the research doesn't provide. The boost
# mode (300kW/664Nm) and three-motor S variant (370kW/973Nm) exist per
# research but aren't modeled — this profile represents the standard dual-
# motor D-mode configuration.
#
# The four independent coolant circuits (22L total) are simplified to two
# CoolingLoop entries (battery + combined powertrain) — see the
# thermal_architecture section below for how the researched 22L figure is
# assigned.
#
# model_year_range: research states an open-ended "2019+"; no end year is
# given, so this uses [2019, 2019] rather than inventing one.
#
# VehicleDynamics, AuxLoads, and most of the battery's equivalent-circuit
# parameters are NOT covered by the research — shared placeholder values,
# identical across all six profiles. See nissan_leaf.yaml's header comment
# for the full rationale.

