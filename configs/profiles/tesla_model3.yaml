# ManufacturerProfile data for the Tesla Model 3 (2017+).
# Source: docs/research/profiles_v1.md — Tesla Model 3.
# See src/ev_thermal/schema.py:ManufacturerProfile for the shape.
#
# Represents the post-late-2020 "octovalve" configuration (integrated
# multi-mode heat pump with waste-heat recovery), since that's the
# thermally-richer, more-completely-described configuration in the
# research; the earlier PTC-heater-only (2017-2020) variant existed too
# but isn't modeled as a separate profile here. Single rear-motor (RWD)
# configuration modeled, not the front+rear AWD variant — the research
# gives both motors' specs, but AWD adds complexity (which motor handles
# which torque split under thermal stress) not resolved by the source
# material.
#
# model_year_range: research states an open-ended "2017+" (still in
# production); no end year is given, so this uses [2017, 2017] rather than
# inventing one — see docs/model_reference.md.
#
# VehicleDynamics, AuxLoads, and most of the battery's equivalent-circuit
# parameters are NOT covered by the research — shared placeholder values,
# identical across all six profiles. See nissan_leaf.yaml's header comment
# for the full rationale.

